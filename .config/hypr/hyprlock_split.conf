# Hyprlock Vanta Black (Ambient Cover Background + Smooth Pulsing Edges + Synced Music)

$font = CaskaydiaCove Nerd Font Mono

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = fadeIn, 1, 2, quick
    animation = fadeOut, 1, 2, quick
}

# 1. FULL BACKGROUND IN COVER COLORS (Dark Vignette + Ambient Blur)
background {
    monitor =
    path = ~/.cache/hyprlock_mpris/bg.png
    color = rgba(5, 5, 5, 1.0)
    blur_passes = 0
}

# 2. FULLSCREEN SMOOTH PULSING BORDER GLOW (Pre-rendered 12-frame pulse loop)
image {
    monitor =
    path = ~/.cache/hyprlock_mpris/pulse_current.png
    size = 1366
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    reload_time = 1
    reload_cmd = echo ~/.cache/hyprlock_mpris/pulse_current.png
}

# ---------------------------------------------
# LEFT PANEL: Clock, Date, Password, Layout, Caps
# ---------------------------------------------

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 84
    font_family = $font
    position = 100, 120
    halign = left
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 1.0)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(160, 160, 160, 0.8)
    font_size = 18
    font_family = $font
    position = 105, 45
    halign = left
    valign = center
}

# INPUT FIELD (Sharp Vanta Black Box)
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false

    inner_color = rgba(0, 0, 0, 0.85)
    outer_color = rgba(55, 55, 55, 0.9)
    check_color = rgba(200, 200, 200, 0.9)
    fail_color = rgba(100, 100, 100, 0.9)
    capslock_color = rgba(255, 255, 255, 0.9)

    font_color = rgba(240, 240, 240, 0.9)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = <span foreground="##666666">enter password...</span>
    fail_text = <span foreground="##888888">incorrect ($ATTEMPTS)</span>

    position = 105, -35
    halign = left
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.95)
}

# BOTTOM-LEFT: KEYBOARD LAYOUT & CAPS LOCK STATUS
label {
    monitor =
    text = 󰌌  $LAYOUT[en,ru]
    color = rgba(160, 160, 160, 0.8)
    font_size = 13
    font_family = $font
    position = 105, -95
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/caps_lock.sh
    color = rgba(255, 255, 255, 0.95)
    font_size = 13
    font_family = $font
    position = 200, -95
    halign = left
    valign = center
}


# ---------------------------------------------
# RIGHT PANEL: Music Player (Cover, Track, Timeline, Lyrics)
# ---------------------------------------------

# 1. ALBUM COVER (LARGE: 180x180)
image {
    monitor =
    path = ~/.cache/hyprlock_mpris/cover.png
    size = 180
    rounding = 0
    border_size = 1
    border_color = rgba(60, 60, 60, 0.95)
    position = 340, 150
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 1.0)
}

# 2. TRACK TITLE & ARTIST
label {
    monitor =
    text = cmd[update:150] cat ~/.cache/hyprlock_mpris/track_title.txt 2>/dev/null
    color = rgba(240, 240, 240, 0.95)
    font_size = 13
    font_family = $font
    position = 340, 25
    halign = center
    valign = center
    text_align = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 1.0)
}

# 3. DEDICATED TIMELINE BAR (Always visible, clean monospace)
label {
    monitor =
    text = cmd[update:100] cat ~/.cache/hyprlock_mpris/timeline_bar.txt 2>/dev/null
    color = rgba(180, 180, 180, 0.85)
    font_size = 11
    font_family = $font
    position = 340, -15
    halign = center
    valign = center
    text_align = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 1.0)
}

# 4. FLOWING 3-LINE ANIMATED LYRICS
label {
    monitor =
    text = cmd[update:100] cat ~/.cache/hyprlock_mpris/lyrics_text.txt 2>/dev/null
    color = rgba(255, 255, 255, 0.95)
    font_size = 12
    font_family = $font
    position = 340, -100
    halign = center
    valign = center
    text_align = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 1.0)
}
