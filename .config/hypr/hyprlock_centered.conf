# Hyprlock Vanta Black (Centered Minimal Layout - No Music Playing)

$font = CaskaydiaCove Nerd Font Mono

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = fadeIn, 1, 3, quick
    animation = fadeOut, 1, 3, quick
    animation = inputFieldDots, 1, 2, quick
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.3
    brightness = 0.2
}

# CENTERED TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 1.0)
}

# CENTERED DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(136, 136, 136, 0.8)
    font_size = 18
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}

# CENTERED INPUT FIELD
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    inner_color = rgba(5, 5, 5, 0.9)
    outer_color = rgba(50, 50, 50, 0.9)
    check_color = rgba(180, 180, 180, 0.9)
    fail_color = rgba(100, 100, 100, 0.9)
    capslock_color = rgba(255, 255, 255, 0.9)

    font_color = rgba(240, 240, 240, 0.9)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = <span foreground="##555555">enter password...</span>
    fail_text = <span foreground="##888888">incorrect ($ATTEMPTS)</span>

    position = 0, -45
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.9)
}

# CENTERED KEYBOARD LAYOUT & CAPS LOCK
label {
    monitor =
    text = 󰌌  $LAYOUT[en,ru]
    color = rgba(100, 100, 100, 0.7)
    font_size = 12
    font_family = $font
    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/caps_lock.sh
    color = rgba(255, 255, 255, 0.95)
    font_size = 12
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}
