# Hyprlock French Exit Configuration
# Full screen ambient gradient background in French Exit colors
# Left: Clock, Date, Password Field, Layout, Caps Lock
# Right: French Exit (TV Girl) Large Cover

$font = CaskaydiaCove Nerd Font Mono

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = quick, 0.15, 0, 0.1, 1
    animation = fadeIn, 1, 3, quick
    animation = fadeOut, 1, 3, quick
    animation = inputFieldDots, 1, 2, quick
}

# 1. FULLSCREEN FRENCH EXIT AMBIENT GRADIENT BACKGROUND
background {
    monitor =
    path = ~/.cache/hyprlock_static/french_exit_bg.png
    color = rgba(10, 2, 2, 1.0)
    blur_passes = 0
}

# ---------------------------------------------
# LEFT PANEL: Clock, Date, Password, Layout, Caps
# ---------------------------------------------

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 235, 235, 0.95)
    font_size = 84
    font_family = $font
    position = 100, 120
    halign = left
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 1.0)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(220, 140, 145, 0.85)
    font_size = 18
    font_family = $font
    position = 105, 45
    halign = left
    valign = center
}

# INPUT FIELD (French Exit Crimson Accent Box)
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false

    inner_color = rgba(10, 3, 3, 0.9)
    outer_color = rgba(96, 29, 30, 0.9)
    check_color = rgba(221, 74, 74, 0.9)
    fail_color = rgba(120, 30, 30, 0.9)
    capslock_color = rgba(255, 100, 100, 0.9)

    font_color = rgba(242, 212, 212, 0.9)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = <span foreground="##8c5556">enter password...</span>
    fail_text = <span foreground="##dd4a4a">incorrect ($ATTEMPTS)</span>

    position = 105, -35
    halign = left
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.95)
}

# BOTTOM-LEFT: KEYBOARD LAYOUT & CAPS LOCK STATUS
label {
    monitor =
    text = 󰌌  $LAYOUT[en,ru]
    color = rgba(201, 122, 126, 0.8)
    font_size = 13
    font_family = $font
    position = 105, -95
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/caps_lock.sh
    color = rgba(221, 74, 74, 0.95)
    font_size = 13
    font_family = $font
    position = 200, -95
    halign = left
    valign = center
}


# ---------------------------------------------
# RIGHT PANEL: French Exit Album Cover
# ---------------------------------------------

# LARGE FRENCH EXIT COVER (260x260, Crimson Border)
image {
    monitor =
    path = ~/.cache/hyprlock_static/french_exit.png
    size = 260
    rounding = 0
    border_size = 2
    border_color = rgba(164, 53, 54, 0.95)
    position = 340, 0
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 25
    shadow_color = rgba(0, 0, 0, 1.0)
}
